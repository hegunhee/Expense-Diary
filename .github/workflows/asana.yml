name: Asana Automation

on:
  pull_request:
    types:
      - opened
      - closed

jobs:
  update-asana:
    runs-on: ubuntu-latest

    steps:
      - name: Extract Asana Task ID from PR Body
        id: extract
        shell: bash
        run: |
          BODY="${{ github.event.pull_request.body }}"
          
          TASK_ID=$(echo "$BODY" | sed -nE 's#.*task/([0-9]+).*#\1#p' | head -1)
          
          echo "TASK_ID=$TASK_ID"
          
          echo "task_id=$TASK_ID" >> $GITHUB_OUTPUT

      - name: Skip if no Asana link
        if: steps.extract.outputs.task_id == ''
        run: echo "No Asana task linked. Skipping."

      - name: Move task to In Review
        if: |
          github.event.action == 'opened' &&
          steps.extract.outputs.task_id != ''
        run: |
          curl --request POST \
            --url "https://app.asana.com/api/1.0/sections/${{ vars.ASANA_IN_REVIEW_SECTION_ID }}/addTask" \
            --header "Authorization: Bearer ${{ secrets.ASANA_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{
              "data": {
                "task": "${{ steps.extract.outputs.task_id }}"
              }
            }'

      - name: Move task to Done
        if: |
          github.event.action == 'closed' &&
          github.event.pull_request.merged == true &&
          steps.extract.outputs.task_id != ''
        run: |
          curl --request POST \
            --url "https://app.asana.com/api/1.0/sections/${{ vars.ASANA_DONE_SECTION_ID }}/addTask" \
            --header "Authorization: Bearer ${{ secrets.ASANA_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{
              "data": {
                "task": "${{ steps.extract.outputs.task_id }}"
              }
            }'
